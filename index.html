<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <title>Mustree 네트워크 등록</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 32px 24px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .logo {
      font-size: 48px;
      text-align: center;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin: 0 0 6px 0;
    }
    .subtitle {
      color: #8b8ba0;
      font-size: 14px;
      text-align: center;
      margin-bottom: 24px;
    }
    .network-info {
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 24px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #8b8ba0; }
    .info-value {
      color: #fff;
      font-weight: 500;
      font-family: 'SF Mono', Monaco, Menlo, monospace;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #f6851b 0%, #e2761b 100%);
      color: #fff;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 4px 20px rgba(246, 133, 27, 0.3);
    }
    button:active { transform: scale(0.98); }
    button:disabled {
      background: #2a2a3e;
      color: #555;
      cursor: not-allowed;
      box-shadow: none;
    }
    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      display: none;
      line-height: 1.5;
    }
    .status.success {
      display: block;
      background: rgba(46, 204, 113, 0.15);
      color: #2ecc71;
      border: 1px solid rgba(46, 204, 113, 0.3);
    }
    .status.error {
      display: block;
      background: rgba(231, 76, 60, 0.15);
      color: #e74c3c;
      border: 1px solid rgba(231, 76, 60, 0.3);
    }
    .status.info {
      display: block;
      background: rgba(52, 152, 219, 0.15);
      color: #3498db;
      border: 1px solid rgba(52, 152, 219, 0.3);
    }
    .fallback {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
      color: #8b8ba0;
      text-align: center;
      line-height: 1.6;
    }
    .fallback a {
      color: #f6851b;
      text-decoration: none;
      font-weight: 500;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(52, 152, 219, 0.3);
      border-top-color: #3498db;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🌳</div>
    <h1>Mustree 네트워크 등록</h1>
    <p class="subtitle">메타마스크에 MST 네트워크를 추가합니다</p>

    <div class="network-info">
      <div class="info-row">
        <span class="info-label">네트워크 이름</span>
        <span class="info-value">Mustree</span>
      </div>
      <div class="info-row">
        <span class="info-label">RPC URL</span>
        <span class="info-value">block.mst3.site</span>
      </div>
      <div class="info-row">
        <span class="info-label">체인 ID</span>
        <span class="info-value">7601</span>
      </div>
      <div class="info-row">
        <span class="info-label">통화 기호</span>
        <span class="info-value">MST</span>
      </div>
    </div>

    <button id="addBtn" onclick="addNetwork()">메타마스크에 추가하기</button>
    <div id="status" class="status"></div>

    <div class="fallback">
      메타마스크가 없으신가요?<br>
      <a href="https://play.google.com/store/apps/details?id=io.metamask" target="_blank" rel="noopener">Play Store에서 설치하기</a>
    </div>
  </div>

  <script>
    const NETWORK_PARAMS = {
      chainId: '0x1DB1',
      chainName: 'Mustree',
      nativeCurrency: {
        name: 'MST',
        symbol: 'MST',
        decimals: 18
      },
      rpcUrls: ['https://block.mst3.site']
    };

    function setStatus(html, type) {
      const el = document.getElementById('status');
      el.innerHTML = html;
      el.className = 'status ' + type;
    }

    function openInMetaMask() {
      const host = window.location.host;
      const path = window.location.pathname + window.location.search;
      window.location.href = 'https://metamask.app.link/dapp/' + host + path;
    }

    async function addNetwork() {
      const btn = document.getElementById('addBtn');

      if (typeof window.ethereum === 'undefined') {
        setStatus('메타마스크 앱에서 열어야 합니다.<br>잠시 후 자동으로 이동합니다...', 'info');
        setTimeout(openInMetaMask, 1500);
        return;
      }

      btn.disabled = true;
      setStatus('<span class="spinner"></span>메타마스크에서 승인해 주세요...', 'info');

      try {
        // 1단계: 먼저 이미 등록된 네트워크인지 wallet_switchEthereumChain으로 시도
        // - 이미 등록되어 있으면 전환 성공
        // - 등록 안 되어 있으면 4902 에러 → 그때 wallet_addEthereumChain 호출
        let alreadyExists = false;
        try {
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: NETWORK_PARAMS.chainId }]
          });
          alreadyExists = true;
        } catch (switchError) {
          // 에러 코드 4902: 등록되지 않은 체인 → 정상적인 상황
          // 그 외 코드는 다시 던져서 catch로
          if (switchError.code === 4902 ||
              (switchError.data && switchError.data.originalError && switchError.data.originalError.code === 4902)) {
            // 네트워크 추가 시도
            await window.ethereum.request({
              method: 'wallet_addEthereumChain',
              params: [NETWORK_PARAMS]
            });
          } else {
            throw switchError;
          }
        }

        // 2단계: 실제로 등록·전환됐는지 검증
        const currentChain = await window.ethereum.request({ method: 'eth_chainId' });
        if (currentChain.toLowerCase() === NETWORK_PARAMS.chainId.toLowerCase()) {
          if (alreadyExists) {
            setStatus('✅ 이미 등록되어 있던 Mustree 네트워크로 전환했습니다!', 'success');
          } else {
            setStatus('✅ Mustree 네트워크가 추가되었습니다!', 'success');
          }
          btn.textContent = '완료';
        } else {
          // 호출은 성공했지만 실제 체인이 다름 = 사용자가 마지막에 거부 등
          setStatus('네트워크 전환이 완료되지 않았습니다. 다시 시도해 주세요.', 'error');
          btn.disabled = false;
        }
      } catch (error) {
        console.error(error);
        if (error.code === 4001) {
          setStatus('요청이 거부되었습니다. 다시 시도해 주세요.', 'error');
        } else if (error.code === -32002) {
          setStatus('메타마스크에 이미 요청이 대기 중입니다. 메타마스크 앱을 확인해 주세요.', 'info');
        } else {
          setStatus('오류: ' + (error.message || '알 수 없는 오류') +
                    '<br><span style="font-size:11px;opacity:0.7;">(code: ' + (error.code || 'unknown') + ')</span>', 'error');
        }
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
