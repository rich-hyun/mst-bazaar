<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A1MOBILSOFT 네트워크 등록</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      --bg: #050a14;
      --surface: #0d1a2e;
      --card: #0f2040;
      --accent: #00c6ff;
      --accent2: #0072ff;
      --text: #e8f4fd;
      --muted: #5a7fa8;
      --border: rgba(0, 198, 255, 0.18);
      --glow: 0 0 24px rgba(0,198,255,0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,198,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,198,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* radial glow top */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,114,255,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* header */
    .header {
      text-align: center;
    }
    .header .badge {
      display: inline-block;
      background: rgba(0,198,255,0.1);
      border: 1px solid var(--border);
      color: var(--accent);
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      padding: 0.35rem 1rem;
      border-radius: 100px;
      margin-bottom: 1rem;
    }
    .header h1 {
      font-family: 'Orbitron', monospace;
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }
    .header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.5rem;
      font-weight: 300;
    }

    /* network info card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--glow);
    }
    .card-title {
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 400;
    }
    .info-value {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      text-align: right;
      max-width: 60%;
      word-break: break-all;
    }
    .info-value.mono {
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
    }

    /* add button */
    .btn-add {
      width: 100%;
      background: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 100%);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      border: none;
      border-radius: 14px;
      padding: 1.1rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 4px 20px rgba(0,114,255,0.4);
      position: relative;
      overflow: hidden;
    }
    .btn-add::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,114,255,0.55); }
    .btn-add:hover::before { opacity: 1; }
    .btn-add:active { transform: translateY(0); }
    .btn-add:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* status msg */
    .status {
      text-align: center;
      font-size: 0.85rem;
      min-height: 1.4em;
      color: var(--muted);
      transition: color 0.3s;
    }
    .status.success { color: #4ade80; }
    .status.error   { color: #f87171; }

    /* qr section */
    .qr-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .qr-section .card-title { margin-bottom: 0; }
    .qr-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      display: inline-block;
      box-shadow: 0 0 30px rgba(0,198,255,0.2);
    }
    #qrcode canvas, #qrcode img { display: block; }
    .qr-caption {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    /* footer */
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a2f4a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1.5rem;
      border-radius: 100px;
      font-size: 0.85rem;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="badge">BLOCKCHAIN NETWORK</div>
      <h1>A1MOBILSOFT</h1>
      <p>메타마스크에 네트워크를 자동으로 추가합니다</p>
    </div>

    <div class="card">
      <div class="card-title">⬡ 네트워크 정보</div>
      <div class="info-row">
        <span class="info-label">네트워크 이름</span>
        <span class="info-value">A1MOBILSOFT</span>
      </div>
      <div class="info-row">
        <span class="info-label">RPC URL</span>
        <span class="info-value mono">a1mobilsoft.mst2.site</span>
      </div>
      <div class="info-row">
        <span class="info-label">Chain ID</span>
        <span class="info-value mono">7602</span>
      </div>
      <div class="info-row">
        <span class="info-label">통화 기호</span>
        <span class="info-value mono">A1MS</span>
      </div>
    </div>

    <button class="btn-add" id="addBtn" onclick="addNetwork()">
      🦊 메타마스크에 네트워크 추가
    </button>
    <div class="status" id="status"></div>

    <div class="qr-section">
      <div class="card-title">📱 QR 코드로 스캔하기</div>
      <div class="qr-wrap">
        <div id="qrcode"></div>
      </div>
      <p class="qr-caption">
        카메라로 QR을 스캔하면 이 페이지가 열립니다<br>
        메타마스크 앱에서 열어주세요
      </p>
    </div>

    <div class="footer">A1MOBILSOFT · Chain ID 7602 · A1MS</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ── QR 코드 생성 ──────────────────────────────────────────
    (function generateQR() {
      const raw = window.location.href.replace(/^https?:\/\//, '');
      const target = 'https://metamask.app.link/dapp/' + raw;

      new QRCode(document.getElementById('qrcode'), {
        text: target,
        width: 200,
        height: 200,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H,
      });
    })();

    // ── MetaMask 네트워크 추가 ─────────────────────────────────
    async function addNetwork() {
      const btn    = document.getElementById('addBtn');
      const status = document.getElementById('status');

      if (!window.ethereum) {
        showStatus('⚠️ 메타마스크를 찾을 수 없습니다. 메타마스크 앱 내 브라우저에서 열어주세요.', 'error');
        return;
      }

      btn.disabled = true;
      showStatus('네트워크 추가 중...', '');

      try {
        await window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [{
            chainId: '0x' + (7602).toString(16),
            chainName: 'A1MOBILSOFT',
            rpcUrls: ['https://a1mobilsoft.mst2.site'],
            nativeCurrency: { name: 'A1MOBILSOFT', symbol: 'A1MS', decimals: 18 },
            blockExplorerUrls: [],
          }],
        });
        showStatus('✅ 네트워크가 성공적으로 추가되었습니다!', 'success');
        showToast('✅ A1MOBILSOFT 네트워크 추가 완료!');
      } catch (err) {
        if (err.code === 4001) {
          showStatus('❌ 사용자가 요청을 취소했습니다.', 'error');
        } else {
          showStatus('❌ 오류: ' + (err.message || err), 'error');
        }
      } finally {
        btn.disabled = false;
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
