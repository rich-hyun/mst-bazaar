<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>차량 반납 NFT 발행</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&family=Share+Tech+Mono&display=swap');

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --card: #161616;
      --border: #2a2a2a;
      --accent: #e8c84a;
      --accent2: #ff6b35;
      --text: #f0f0f0;
      --muted: #666;
      --ok: #4ade80;
      --ng: #f87171;
      --warn: #fbbf24;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
    }

    /* ── 헤더 ── */
    .header {
      background: #000;
      border-bottom: 2px solid var(--accent);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .header-badge {
      background: var(--accent);
      color: #000;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      padding: 0.3rem 0.8rem;
      border-radius: 3px;
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.08em;
      color: #fff;
    }
    .header h1 span { color: var(--accent); }
    .header-chain {
      margin-left: auto;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ── 메인 그리드 ── */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 700px) {
      .container { grid-template-columns: 1fr; }
    }

    /* ── 카드 공통 ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .card-header {
      background: #1a1a1a;
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .card-header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .card-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.1em;
      color: var(--accent);
    }
    .card-body { padding: 1.2rem; }

    /* ── 차량 사진 ── */
    .photo-wrap {
      position: relative;
      border-radius: 3px;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: #0d0d0d;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .photo-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
      pointer-events: none;
    }
    .photo-tag {
      position: absolute;
      bottom: 0.8rem; left: 0.8rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent);
      background: rgba(0,0,0,0.7);
      padding: 0.25rem 0.6rem;
      border-radius: 2px;
      border: 1px solid var(--accent);
    }
    .photo-change {
      position: absolute;
      top: 0.6rem; right: 0.6rem;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 0.72rem;
      font-family: 'Noto Sans KR', sans-serif;
      padding: 0.3rem 0.7rem;
      border-radius: 2px;
      border: 1px solid #333;
      cursor: pointer;
      transition: background 0.2s;
    }
    .photo-change:hover { background: rgba(255,255,255,0.15); }
    #fileInput { display: none; }

    /* ── 폼 ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }
    .form-full { grid-column: 1/-1; }
    label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
    }
    input[type=text], input[type=date], select, textarea {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.88rem;
      padding: 0.55rem 0.75rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    select option { background: #111; }
    textarea { resize: vertical; min-height: 60px; font-family: 'Noto Sans KR', sans-serif; font-size: 0.82rem; }

    /* ── 사고이력 체크리스트 ── */
    .parts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .part-item {
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.6rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .part-item:hover { border-color: #444; }
    .part-item.ok  { border-color: var(--ok);  background: rgba(74,222,128,0.06); }
    .part-item.ng  { border-color: var(--ng);  background: rgba(248,113,113,0.06); }
    .part-item.rep { border-color: var(--warn); background: rgba(251,191,36,0.06); }
    .part-name {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .part-status {
      display: flex;
      gap: 0.3rem;
    }
    .status-btn {
      flex: 1;
      border: none;
      border-radius: 2px;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.22rem 0;
      cursor: pointer;
      background: #222;
      color: var(--muted);
      transition: all 0.15s;
      font-family: 'Share Tech Mono', monospace;
    }
    .status-btn.active-ok  { background: var(--ok);  color: #000; }
    .status-btn.active-ng  { background: var(--ng);  color: #000; }
    .status-btn.active-rep { background: var(--warn); color: #000; }

    /* ── 분리선 ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1rem 0;
    }

    /* ── 전체 너비 카드 ── */
    .full-col { grid-column: 1/-1; }

    /* ── 메타데이터 미리보기 ── */
    .meta-preview {
      background: #050505;
      border: 1px solid #1e1e1e;
      border-radius: 3px;
      padding: 1rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      color: #aaa;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .meta-preview .key { color: var(--accent); }
    .meta-preview .val { color: #7dd3fc; }
    .meta-preview .str { color: var(--ok); }

    /* ── 버튼들 ── */
    .btn-row {
      display: flex;
      gap: 0.8rem;
      margin-top: 1rem;
    }
    .btn {
      flex: 1;
      padding: 0.9rem;
      border-radius: 3px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-connect {
      background: #1a1a1a;
      color: var(--text);
      border: 1px solid #333;
    }
    .btn-connect:hover { border-color: #666; }
    .btn-connect.connected {
      border-color: var(--ok);
      color: var(--ok);
    }
    .btn-mint {
      background: var(--accent);
      color: #000;
      box-shadow: 0 4px 20px rgba(232,200,74,0.3);
    }
    .btn-mint:hover { background: #f5d84a; box-shadow: 0 4px 28px rgba(232,200,74,0.5); }
    .btn-mint:disabled { background: #2a2a2a; color: var(--muted); box-shadow: none; cursor: not-allowed; }

    /* ── 상태 메시지 ── */
    .status-msg {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.8rem;
      min-height: 1.2em;
      font-family: 'Share Tech Mono', monospace;
    }
    .status-msg.ok { color: var(--ok); }
    .status-msg.err { color: var(--ng); }
    .status-msg.warn { color: var(--warn); }

    /* ── NFT 결과 ── */
    .nft-result {
      display: none;
      background: linear-gradient(135deg, #111 0%, #1a1500 100%);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 1.5rem;
      text-align: center;
    }
    .nft-result.show { display: block; }
    .nft-result h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .nft-hash {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      color: #7dd3fc;
      word-break: break-all;
      margin-top: 0.5rem;
      background: #050505;
      padding: 0.6rem;
      border-radius: 3px;
    }
    .nft-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .nft-meta-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid #222;
      border-radius: 3px;
      padding: 0.5rem;
    }
    .nft-meta-item .mk { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }
    .nft-meta-item .mv { font-size: 0.85rem; font-weight: 700; color: var(--text); margin-top: 0.2rem; }

    /* ── 스크롤바 ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  </style>
</head>

<script>
// ── 차량 부위 정의 ──────────────────────────────────
const PARTS = [
  { id:'frontBumper',  label:'앞 범퍼' },
  { id:'rearBumper',   label:'뒷 범퍼' },
  { id:'hood',         label:'보닛/후드' },
  { id:'trunk',        label:'트렁크' },
  { id:'roofPanel',    label:'루프 패널' },
  { id:'leftFront',    label:'좌측 앞도어' },
  { id:'rightFront',   label:'우측 앞도어' },
  { id:'leftRear',     label:'좌측 뒷도어' },
  { id:'rightRear',    label:'우측 뒷도어' },
  { id:'leftFender',   label:'좌측 휀더' },
  { id:'rightFender',  label:'우측 휀더' },
  { id:'engineRoom',   label:'엔진룸' },
];

const partState = {};
PARTS.forEach(p => partState[p.id] = 'ok');

// 기본값: 뒷범퍼 손상
partState['rearBumper'] = 'ng';

function renderParts() {
  const grid = document.getElementById('partsGrid');
  grid.innerHTML = '';
  PARTS.forEach(part => {
    const s = partState[part.id];
    const div = document.createElement('div');
    div.className = `part-item ${s}`;
    div.innerHTML = `
      <div class="part-name">${part.label}</div>
      <div class="part-status">
        <button class="status-btn ${s==='ok'?'active-ok':''}" onclick="setPart('${part.id}','ok')">OK</button>
        <button class="status-btn ${s==='rep'?'active-rep':''}" onclick="setPart('${part.id}','rep')">REP</button>
        <button class="status-btn ${s==='ng'?'active-ng':''}" onclick="setPart('${part.id}','ng')">NG</button>
      </div>`;
    grid.appendChild(div);
  });
  updateMeta();
}

function setPart(id, state) {
  partState[id] = state;
  renderParts();
}

// ── 사진 변경 ─────────────────────────────────────
function changePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('carPhoto').src = ev.target.result;
    updateMeta();
  };
  reader.readAsDataURL(file);
}

// ── 메타데이터 생성 ───────────────────────────────
function buildMetadata() {
  const plate     = document.getElementById('plate').value || '-';
  const model     = document.getElementById('carModel').value || '-';
  const year      = document.getElementById('carYear').value || '-';
  const insurer   = document.getElementById('insurer').value || '-';
  const policyNum = document.getElementById('policyNum').value || '-';
  const rDate     = document.getElementById('returnDate').value || new Date().toISOString().slice(0,10);
  const memo      = document.getElementById('memo').value || '';
  const accDetail = document.getElementById('accidentDetail').value || '';

  const accidentParts = PARTS.map(p => ({
    part: p.label,
    status: partState[p.id] === 'ok' ? '이상없음' : partState[p.id] === 'rep' ? '수리완료' : '손상있음'
  }));

  return {
    name: `차량반납 NFT · ${plate}`,
    description: `${model} (${year}) 차량 보험 반납 기록`,
    attributes: [
      { trait_type: '차량번호', value: plate },
      { trait_type: '차종',    value: model },
      { trait_type: '연식',    value: year },
      { trait_type: '보험사',  value: insurer },
      { trait_type: '증권번호', value: policyNum },
      { trait_type: '반납일자', value: rDate },
    ],
    accident_history: accidentParts,
    accident_detail: accDetail,
    memo: memo,
    chain: 'A1MOBILSOFT',
    chainId: 7602,
    issuedAt: new Date().toISOString(),
  };
}

function updateMeta() {
  const meta = buildMetadata();
  const pre = document.getElementById('metaPreview');
  pre.textContent = JSON.stringify(meta, null, 2);
}

// ── 날짜 기본값 ───────────────────────────────────
document.getElementById('returnDate').value = new Date().toISOString().slice(0,10);

// 입력 변경 감지
['plate','carModel','carYear','insurer','policyNum','returnDate','memo','accidentDetail']
  .forEach(id => document.getElementById(id).addEventListener('input', updateMeta));

renderParts();

// ── MetaMask 연결 ─────────────────────────────────
let connectedAddr = null;

async function connectWallet() {
  if (!window.ethereum) {
    setStatus('⚠️ 메타마스크가 없습니다. 메타마스크 앱 브라우저에서 열어주세요.', 'err');
    return;
  }
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    connectedAddr = accounts[0];
    const btn = document.getElementById('connectBtn');
    btn.textContent = '✓ ' + connectedAddr.slice(0,6) + '...' + connectedAddr.slice(-4);
    btn.classList.add('connected');
    document.getElementById('mintBtn').disabled = false;
    setStatus('지갑 연결 완료. NFT 발행 버튼을 눌러주세요.', 'ok');
  } catch(e) {
    setStatus('❌ 지갑 연결 취소됨', 'err');
  }
}

// ── NFT 발행 (서명 기반 온체인 기록) ──────────────
async function mintNFT() {
  if (!connectedAddr) { setStatus('지갑을 먼저 연결해주세요', 'warn'); return; }

  const mintBtn = document.getElementById('mintBtn');
  mintBtn.disabled = true;
  setStatus('⏳ 서명 요청 중...', 'warn');

  try {
    // 네트워크 전환
    try {
      await window.ethereum.request({
        method: 'wallet_switchEthereumChain',
        params: [{ chainId: '0x' + (7602).toString(16) }],
      });
    } catch(switchErr) {
      if (switchErr.code === 4902) {
        await window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [{
            chainId: '0x' + (7602).toString(16),
            chainName: 'A1MOBILSOFT',
            rpcUrls: ['https://a1mobilsoft.mst2.site'],
            nativeCurrency: { name: 'A1MOBILSOFT', symbol: 'A1MS', decimals: 18 },
          }],
        });
      }
    }

    setStatus('⏳ 메타데이터 서명 중...', 'warn');
    const meta = buildMetadata();
    const msgStr = JSON.stringify(meta, null, 2);
    const msgHex = '0x' + Array.from(new TextEncoder().encode(msgStr))
                          .map(b => b.toString(16).padStart(2,'0')).join('');

    const signature = await window.ethereum.request({
      method: 'personal_sign',
      params: [msgHex, connectedAddr],
    });

    // 서명 해시를 NFT ID로 활용
    const nftId = signature.slice(0, 42);
    showResult(meta, signature, nftId);
    setStatus('✅ NFT 발행 완료!', 'ok');

  } catch(e) {
    if (e.code === 4001) setStatus('❌ 서명 취소됨', 'err');
    else setStatus('❌ 오류: ' + (e.message||e), 'err');
    mintBtn.disabled = false;
  }
}

function showResult(meta, sig, nftId) {
  const res = document.getElementById('nftResult');
  res.classList.add('show');
  document.getElementById('nftHash').textContent = '서명: ' + sig;

  const damaged = meta.accident_history.filter(p => p.status !== '이상없음').length;
  document.getElementById('nftMeta').innerHTML = `
    <div class="nft-meta-item"><div class="mk">차량번호</div><div class="mv">${meta.attributes[0].value}</div></div>
    <div class="nft-meta-item"><div class="mk">차종</div><div class="mv">${meta.attributes[1].value}</div></div>
    <div class="nft-meta-item"><div class="mk">손상 부위</div><div class="mv" style="color:var(--warn)">${damaged}개소</div></div>
  `;
  res.scrollIntoView({behavior:'smooth'});
}

function setStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + (type||'');
}
</script>
